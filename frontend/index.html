<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCrawl</title>
    <!-- Served from frontend/public, which Vite copies to the dist root. -->
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <script>
      // Apply the saved crawler before first paint to avoid an accent flash.
      // Sapphire is the default, so only ruby/topaz need stamping.
      var crawler = localStorage.getItem('opencrawl-crawler');
      if (crawler === 'ruby' || crawler === 'topaz') {
        document.documentElement.dataset.crawler = crawler;
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
